<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' wss: https:"
    />
    <title>Synced Video Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="welcome" class="home" hidden>
      <form id="welcome-form" class="home-card welcome-card">
        <h1 id="welcome-title">Welcome</h1>
        <p id="welcome-lede" class="lede"></p>
        <label class="field">
          <span>Username</span>
          <span class="handle-row">
            <input id="handle" maxlength="20" autocomplete="off" spellcheck="false" placeholder="username" />
            <span id="handle-tag" class="handle-tag"></span>
          </span>
          <small id="handle-hint" class="hint"></small>
        </label>
        <label class="field">
          <span>Display name</span>
          <input id="welcome-name" maxlength="40" autocomplete="off" spellcheck="false" placeholder="Display name" />
          <small class="hint">What people see. You can change it any time.</small>
        </label>
        <button id="welcome-submit" class="primary big" type="submit" disabled>Continue</button>
        <button id="welcome-cancel" class="ghost" type="button" hidden>Cancel</button>
      </form>
    </main>

    <main id="home" class="home" hidden>
      <div class="home-layout">
      <div class="home-card">
        <section class="profile-card">
          <span id="profile-avatar" class="avatar big-avatar">?</span>
          <div class="profile-main">
            <input id="profile-name" class="profile-name name-input" maxlength="40" spellcheck="false" autocomplete="off" aria-label="Your display name" title="Change your display name" />
            <div class="profile-username">
              <span>Username</span>
              <button id="username" class="username" title="Copy your username to send to a friend">…</button>
              <button id="new-username" class="link-button" title="Friends who added you will have to add you again">Change</button>
            </div>
          </div>
        </section>
        <h1>Synced Video Player</h1>
        <p class="lede">Watch together. Whoever opens a video hosts it, and both of you control playback.</p>
        <button id="create" class="primary big">Create a room</button>
        <div class="divider">or join one</div>
        <form id="join-form" class="join">
          <input id="join-code" placeholder="ABCD-EFGH" maxlength="9" autocomplete="off" spellcheck="false" aria-label="Room code" />
          <button type="submit">Join</button>
        </form>
      </div>

      <section class="friends-panel">
        <h2>Friends</h2>
        <form id="add-friend" class="add-friend">
          <input id="friend-username" placeholder="Friend's username" autocomplete="off" spellcheck="false" aria-label="Friend's username" />
          <button type="submit">Add</button>
        </form>
        <p id="friend-error" class="friend-error" hidden></p>
        <ul id="friend-requests" class="friend-list"></ul>
        <ul id="friend-list" class="friend-list"></ul>
        <p id="friends-empty" class="friends-empty">Send your username to a friend and add theirs.</p>
      </section>
      </div>
    </main>

    <section id="room" class="room" hidden>
      <header class="topbar">
        <button id="code" class="code" title="Copy room code"></button>
        <span id="peer-status" class="peer-status"></span>
        <span id="link" class="link" data-level="good" hidden></span>
        <span id="title" class="title"></span>
        <span id="role" class="role"></span>
        <button id="board-toggle" class="ghost icon-button" title="Whiteboard">
          <svg viewBox="0 0 24 24"><path d="M3.5 17.3V20.5h3.2l9.4-9.4-3.2-3.2zm15-8.8a.9.9 0 0 0 0-1.2l-2-2a.9.9 0 0 0-1.2 0L13.7 6.9l3.2 3.2z" /><path d="M2 22h20v-1H2z" /></svg>
        </button>
        <button id="people-toggle" class="ghost people-toggle" title="People in the room">
          <svg viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 13c-3.3 0-7 1.6-7 4v3h14v-3c0-2.4-3.7-4-7-4zm7 0c-.4 0-.8 0-1.2.1 1.3.9 2.2 2.2 2.2 3.9v3h5v-3c0-2.2-3.2-4-6-4z" /></svg>
          <span id="people-count">1</span>
        </button>
        <button data-open-video>Open video</button>
        <button id="leave" class="ghost">Leave</button>
      </header>

      <div id="stage" class="stage" data-role="idle">
        <video id="local-video" class="local"></video>
        <video id="remote-video" class="remote" playsinline></video>
        <div id="captions" class="captions"></div>
        <canvas id="board" class="board"></canvas>

        <div id="empty" class="empty">
          <p id="empty-text"></p>
          <button data-open-video class="primary">Open video</button>
        </div>
        <div id="spinner" class="spinner" hidden></div>
        <div id="link-warning" class="link-warning" tabindex="0" aria-label="Connection problem" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 2 1 21h22zm1 16h-2v-2h2zm0-4h-2V9h2z" /></svg>
          <div id="link-warning-tip" class="link-warning-tip" role="tooltip"></div>
        </div>
        <div id="toast" class="toast" hidden></div>

        <div id="controls" class="controls">
          <button id="play" class="icon" data-state="paused" title="Play / pause (Space)">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
            <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
          </button>
          <span id="time" class="time">0:00</span>
          <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek" />
          <span id="duration" class="time">0:00</span>
          <div id="reactions" class="reactions" aria-label="Reactions"></div>
          <select id="audio-select" title="Audio track"></select>
          <select id="subtitle-select" title="Subtitles"></select>
          <svg class="volume-icon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9zm12.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z" /></svg>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
          <button id="fullscreen" class="icon" title="Fullscreen (F)">
            <svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 4v-4h2v6h-6v-2z" /></svg>
          </button>
        </div>
      </div>

      <aside id="sidebar" class="sidebar">
        <h2>In the room</h2>
        <ul id="people" class="people"></ul>
      </aside>

      <div id="join-requests" class="join-requests"></div>
      <div id="reaction-feed" class="reaction-feed"></div>
      <canvas id="confetti" class="confetti" hidden></canvas>

      <div id="board-tools" class="board-tools">
        <button id="pen" class="tool" title="Pen: draw on the video">
          <svg viewBox="0 0 24 24"><path d="M3 17.3V21h3.8L17.8 9.9l-3.7-3.7zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7z" /></svg>
        </button>
        <div class="tools-divider"></div>
        <div id="swatches" class="swatches"></div>
        <div class="tools-divider"></div>
        <div id="sizes" class="sizes"></div>
        <div class="tools-divider"></div>
        <button id="board-clear" class="tool" title="Clear the board for everyone">
          <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z" /></svg>
        </button>
      </div>
    </section>

    <script src="bundle.js"></script>
  </body>
</html>
